<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef1f7">
<title>GlassDL</title>
<script>
try{var s=localStorage.getItem('theme')}catch(e){}
document.documentElement.dataset.theme=s||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')
</script>
<style>
*{box-sizing:border-box;margin:0}
main,header{max-width:780px;margin:0 auto}
.glass{position:relative;background:var(--g);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);border:1px solid var(--gb);border-radius:28px;box-shadow:var(--sh),inset 0 1.5px 0 var(--hl),inset 0 -1px 0 rgba(255,255,255,.12)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.24),transparent 40%)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass,.fmt{background:var(--bg)}}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
h1{font-size:clamp(30px,7vw,46px);font-weight:700;letter-spacing:-.035em;text-align:center;margin:26px 0 8px}
.sub{text-align:center;color:var(--t2);margin-bottom:26px}
.bar{display:flex;align-items:center;gap:8px;padding:8px}
.bar input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:inherit;font:inherit;padding:14px}
.bar input::placeholder{color:var(--t2)}
.pill:empty{display:none}
.ghost{background:var(--g);border:1px solid var(--gb);border-radius:20px;height:48px;padding:0 16px}
.pv{display:flex;gap:14px;padding:14px;margin-top:16px;align-items:center}
.pv img{width:136px;aspect-ratio:16/9;object-fit:cover;border-radius:16px;background:var(--g)}
.pv b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pv small{color:var(--t2)}
h2{font-size:15px;font-weight:600;color:var(--t2);margin:24px 6px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
.fmt{text-align:left;padding:14px 16px;border-radius:22px;background:var(--g);border:1px solid var(--gb);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:inset 0 1px 0 var(--hl)}
.fmt:hover{transform:translateY(-2px) scale(1.015)}
.fmt b{display:block;font-size:18px;letter-spacing:-.01em}
.tag{display:block;font-size:12px;font-weight:700;color:var(--ac);margin-bottom:3px}
.m{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.m i{font-style:normal;font-size:12px;padding:3px 9px;border-radius:99px;background:rgba(127,127,127,.17);color:var(--t2)}
.fmt:disabled{opacity:.6;pointer-events:none}
.sk{margin-top:16px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.sk b{font-size:17px}.sk small{color:var(--t2);max-width:420px}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid rgba(127,127,127,.3);border-top-color:var(--ac);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--t2);padding:30px 10px}
.foot{text-align:center;color:var(--t2);font-size:13px;margin-top:34px}
#t.on{transform:translate(-50%,0);opacity:1}
@media(max-width:520px){.pv{flex-direction:column;align-items:stretch}.pv img{width:100%}.bar .ghost{display:none}}

:root{--bg:#eef1f7;--t:#0f1522;--t2:#5b657a;--g:rgba(255,255,255,.72);--gb:rgba(255,255,255,.95);--ac:#0a84ff;--sh:0 10px 34px rgba(40,60,120,.12);--hl:rgba(255,255,255,.9);--e:cubic-bezier(.4,0,.2,1);--sp:cubic-bezier(.34,1.56,.64,1);--tc:background-color .5s var(--e),color .5s var(--e),border-color .5s var(--e),box-shadow .5s var(--e),opacity .25s}
[data-theme=dark]{--bg:#08090e;--t:#f4f6ff;--t2:#9aa3ba;--g:rgba(255,255,255,.06);--gb:rgba(255,255,255,.13);--sh:0 10px 34px rgba(0,0,0,.5);--hl:rgba(255,255,255,.22)}
html{background:var(--bg)}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:var(--t);min-height:100dvh;background:var(--bg);padding:max(16px,env(safe-area-inset-top)) 16px max(40px,env(safe-area-inset-bottom));overflow-x:hidden;-webkit-tap-highlight-color:transparent}
html.ready :where(*,*::before,*::after){transition:var(--tc)}
html.ready body{transition:background-color .5s var(--e),color .5s var(--e)}
html.ready{transition:background-color .5s var(--e)}
header{display:flex;justify-content:flex-end;gap:10px;padding-top:4px}
main{transition:opacity .17s var(--e)}main.fx{opacity:0}
button{font:inherit;color:inherit;border:0;cursor:pointer;transition:transform .4s var(--sp),var(--tc)}
button:active{transform:scale(.97)}
.sw{position:relative;flex:none;width:64px;height:36px;padding:0;border-radius:99px;background:rgba(120,120,128,.3);touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:inset 0 1px 3px rgba(0,0,0,.12)}
.sw.wide{width:76px}
.sw:active{transform:none}
.sw.on{background:var(--ac)}
.kn{position:absolute;top:4px;left:4px;width:36px;height:28px;border-radius:99px;background:#fff;color:#1c1c1e;box-shadow:0 2px 6px rgba(0,0,0,.28);border:1px solid transparent;display:grid;place-items:center;transform:translateX(var(--x,0px));transition:transform .5s var(--sp),background-color .3s,box-shadow .3s,border-color .3s,color .3s}
.sw.on{--x:20px}.sw.wide.on{--x:32px}
.sw.drag .kn{transition:background-color .3s,box-shadow .3s,border-color .3s,color .3s}
.sw.press .kn{transform:translateX(var(--x,0px)) scale(1.3,1.22);background:rgba(255,255,255,.2);color:var(--t);border-color:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(3px) saturate(1.8) brightness(1.1);backdrop-filter:blur(3px) saturate(1.8) brightness(1.1);box-shadow:0 6px 16px rgba(0,0,0,.25),inset 0 2px 3px rgba(255,255,255,.7),inset 0 -2px 3px rgba(255,255,255,.35)}
.kn>*{grid-area:1/1;transition:opacity .25s var(--e),transform .35s var(--sp)}
.kn b{font-size:13px;font-weight:700}
.kn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.k1,.sun{opacity:0;transform:scale(.6)}
.sw.on .k1,.sw.on .sun{opacity:1;transform:none}
.sw.on .k0,.sw.on .moon{opacity:0;transform:scale(.6)}
.pill{font-size:13px;font-weight:600;padding:5px 11px;border-radius:99px;background:rgba(10,132,255,.16);color:var(--ac);white-space:nowrap;max-width:130px;overflow:hidden;flex:none;transition:max-width .4s var(--e),padding .4s var(--e),margin .4s var(--e),opacity .3s,var(--tc)}
.pill.hide{max-width:0;padding-left:0;padding-right:0;margin-left:-8px;opacity:0}
.btn{background:var(--ac);color:#fff;border-radius:20px;height:48px;padding:0 20px;font-weight:600;flex:none}
.btn:disabled{opacity:.55;pointer-events:none}
#t{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;pointer-events:none;padding:12px 20px;border-radius:99px;transition:transform .45s var(--sp),opacity .3s,var(--tc);max-width:90vw;text-align:center}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
#out.anim>*{animation:in .5s var(--e) backwards}
#out.anim .fmt{animation:in .5s var(--e) backwards;animation-delay:calc(var(--n,0)*35ms + 80ms)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <button class="sw wide" id="lsw" role="switch" aria-label="Language / Bahasa"><span class="kn"><b class="k0">ID</b><b class="k1">EN</b></span></button>
  <button class="sw" id="tsw" role="switch" aria-label="Dark mode"><span class="kn">
    <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </span></button>
</header>
<main>
  <h1 data-i="h1"></h1>
  <p class="sub" data-i="sub"></p>
  <div class="glass bar">
    <input id="u" type="url" inputmode="url" aria-label="URL" autocomplete="off">
    <span class="pill hide" id="bd"></span>
    <button class="ghost" id="p" data-i="paste"></button>
    <button class="btn" id="go" data-i="go"></button>
  </div>
  <div id="out" class="anim"><p class="empty" data-i="empty"></p></div>
  <p class="foot" data-i="foot"></p>
</main>
<div class="glass" id="t" role="status" aria-live="polite"></div>
<script>
const L={
id:{doc:'GlassDL, unduh video dari link apa saja',h1:'Unduh video dari link apa saja',sub:'YouTube, Instagram, TikTok, Facebook, X, dan ribuan situs lain. Tanpa iklan, tanpa akun.',ph:'Tempel link video di sini',paste:'Tempel',go:'Cari',empty:'Tempel link, lalu pilih format yang kamu mau.',foot:'Gunakan untuk konten milik sendiri, berlisensi, atau pemakaian pribadi. Link dan file tidak disimpan.',av:'Video dengan suara',vo:'Video saja (suara terbaik ditambahkan otomatis)',ao:'Audio saja',aud:'audio',best:'Terbaik',compat:'Paling kompatibel',small:'Paling kecil',merged:'digabung audio',about:'sekitar',unk:'ukuran belum diketahui',prep:'Menyiapkan file...',started:'Unduhan dimulai, ',badurl:'Masukkan link yang diawali http atau https',clip:'Izinkan akses clipboard, atau tempel manual',fail:'Gagal memuat video',retry:'. Periksa link atau coba lagi.',failprep:'Gagal menyiapkan file',look:'Mencari video...',wait:'Mengambil info dan daftar format, biasanya beberapa detik.',slow:'Masih diproses. Server gratis kadang perlu waktu untuk bangun, mohon tunggu sebentar.'},
en:{doc:'GlassDL, download videos from any link',h1:'Download videos from any link',sub:'YouTube, Instagram, TikTok, Facebook, X and thousands more. No ads, no account.',ph:'Paste a video link here',paste:'Paste',go:'Search',empty:'Paste a link, then pick the format you want.',foot:'Use for your own, licensed, or personal-use content. Links and files are not stored.',av:'Video with audio',vo:'Video only (best audio added automatically)',ao:'Audio only',aud:'audio',best:'Best',compat:'Most compatible',small:'Smallest',merged:'merged with audio',about:'about',unk:'size unknown',prep:'Preparing file...',started:'Download started, ',badurl:'Enter a link starting with http or https',clip:'Allow clipboard access, or paste manually',fail:'Could not load the video',retry:'. Check the link or try again.',failprep:'Could not prepare the file',look:'Looking up the video...',wait:'Fetching info and available formats, usually a few seconds.',slow:'Still working. The free server sometimes needs time to wake up, please wait a moment.'}};
const E={'Link tidak valid':'Invalid link','Hanya link http/https':'Only http/https links','Alamat tidak diizinkan':'Address not allowed','Video ini privat atau perlu login':'This video is private or requires login','Link ini belum didukung':'This link is not supported yet','Video tidak tersedia':'Video unavailable','Platform membatasi permintaan, coba lagi nanti':'The platform is rate limiting, try again later','File terlalu besar (maks 2 GB)':'File too large (max 2 GB)','Gagal memproses video. Coba lagi nanti.':'Could not process the video. Try again later.','Format tidak valid':'Invalid format','Server sedang sibuk, coba sebentar lagi':'Server is busy, try again shortly','File sudah kedaluwarsa, siapkan ulang':'File expired, prepare it again','Terjadi kesalahan server':'Server error'};
const $=s=>document.querySelector(s),u=$('#u'),out=$('#out'),tt=$('#t');
const store=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}};
function detect(){
  const s=store('lang');if(s&&L[s])return s;
  const n=(navigator.languages&&navigator.languages[0]||navigator.language||'').toLowerCase();
  let tz='';try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||''}catch(e){}
  return /^(id|in)\b/.test(n)||/^Asia\/(Jakarta|Makassar|Jayapura|Pontianak)$/.test(tz)?'id':'en';
}
let lang=detect(),cur=null,lastErr=null;
const t=k=>L[lang][k],tr=m=>lang==='id'?m:(E[m]||m);
const sites={youtu:'YouTube',instagram:'Instagram',facebook:'Facebook','fb.':'Facebook',tiktok:'TikTok','x.com':'X',twitter:'X',reddit:'Reddit',vimeo:'Vimeo',twitch:'Twitch'};
const site=s=>(Object.entries(sites).find(([k])=>s.includes(k))||[])[1]||(s.startsWith('http')?'Link':'');
const MB=n=>!n?t('unk'):t('about')+' '+(n>=1e9?(n/1e9).toFixed(2)+' GB':Math.max(1,Math.round(n/1e6))+' MB');
const T=s=>s?[Math.floor(s/3600),Math.floor(s/60)%60,Math.floor(s%60)].filter((x,i)=>i||x).map((x,i)=>i?String(x).padStart(2,'0'):x).join(':'):'';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const say=(m,ms=3800)=>{tt.textContent=m;tt.classList.add('on');clearTimeout(say.t);say.t=setTimeout(()=>tt.classList.remove('on'),ms)};

const main=$('main'),lsw=$('#lsw'),tsw=$('#tsw'),dark=()=>document.documentElement.dataset.theme==='dark';
function sync(){
  lsw.classList.toggle('on',lang==='en');lsw.setAttribute('aria-checked',lang==='en');
  tsw.classList.toggle('on',dark());tsw.setAttribute('aria-checked',dark());
}
function apply(){
  document.documentElement.lang=lang;document.title=t('doc');u.placeholder=t('ph');
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  out.classList.remove('anim');
  if(cur)show(cur);else if(lastErr)fail(lastErr);
  sync();
}
function setLang(l){
  if(l===lang)return;lang=l;store('lang',l);sync();
  main.classList.add('fx');clearTimeout(setLang.t);
  setLang.t=setTimeout(()=>{apply();main.classList.remove('fx')},180);
}
function theme(v){
  document.documentElement.dataset.theme=v;store('theme',v);
  $('meta[name=theme-color]').content=v==='dark'?'#08090e':'#eef1f7';sync();
}
function sw(el,get,set){
  let id=null,x0=0,p0=0,trv=0,mv=false;
  el.addEventListener('pointerdown',e=>{if(e.button)return;id=e.pointerId;el.setPointerCapture(id);x0=e.clientX;trv=el.offsetWidth-44;p0=get()?trv:0;mv=false;el.classList.add('press')});
  el.addEventListener('pointermove',e=>{if(e.pointerId!==id)return;const dx=e.clientX-x0;if(!mv&&Math.abs(dx)<4)return;mv=true;el.classList.add('drag');el.style.setProperty('--x',Math.max(0,Math.min(trv,p0+dx))+'px')});
  const end=(e,ok)=>{if(e.pointerId!==id)return;id=null;let v=get();
    if(ok)v=mv?parseFloat(el.style.getPropertyValue('--x'))>trv/2:!v;
    el.classList.remove('press','drag');el.style.removeProperty('--x');if(v!==get())set(v)};
  el.addEventListener('pointerup',e=>end(e,true));el.addEventListener('pointercancel',e=>end(e,false));
  el.addEventListener('click',e=>{if(e.detail===0)set(!get())});
}
sw(lsw,()=>lang==='en',v=>setLang(v?'en':'id'));
sw(tsw,dark,v=>theme(v?'dark':'light'));

const put=h=>{out.classList.remove('anim');out.innerHTML=h;void out.offsetWidth;out.classList.add('anim')};
const fail=m=>{lastErr=m;put('<p class="empty">'+esc(m?tr(m):t('fail'))+t('retry')+'</p>')};
let slowT;
function loading(){
  put(`<div class="glass sk"><div class="spin"></div><b>${t('look')}</b><small id="lw">${t('wait')}</small></div>`);
  clearTimeout(slowT);slowT=setTimeout(()=>{const e=$('#lw');if(e)e.textContent=t('slow')},7000);
  $('#go').disabled=true;
}
function done(){clearTimeout(slowT);$('#go').disabled=false}
async function load(){
  if($('#go').disabled)return;
  const url=u.value.trim();
  if(!/^https?:\/\//i.test(url))return say(t('badurl'));
  cur=lastErr=null;loading();
  try{
    const r=await fetch('/api/info?url='+encodeURIComponent(url)),d=await r.json();
    if(!r.ok)throw Error(d.error);
    cur=d;show(d);
  }catch(e){fail(e.message)}finally{done()}
}

function show(d){
  const by=k=>d.formats.filter(f=>f.k===k),key=f=>f.h*1e4+f.br,desc=(x,y)=>key(y)-key(x);
  const av=by('av').sort(desc),v=by('v').sort(desc),a=by('a').sort((x,y)=>y.br-x.br);
  const vid=[...av,...v].sort(desc);
  const best=vid[0],compat=vid.find(f=>f.vc==='H.264'&&f.ext==='mp4'),small=av.filter(f=>f.size).sort((x,y)=>x.size-y.size)[0];
  const tag=f=>f===best?t('best'):f===compat?t('compat'):f===small?t('small'):'';
  const card=(f,i)=>`<button class="fmt" style="--n:${Math.min(i,10)}" data-f="${esc(f.id)}" data-k="${f.k}" data-e="${f.ext}">${tag(f)?`<span class="tag">${tag(f)}</span>`:''}<b>${f.h?f.h+'p'+(f.fps>30?f.fps:'')+' '+f.ext.toUpperCase():f.ext.toUpperCase()+' '+t('aud')}</b><span class="m">${[f.vc,f.ac,f.k==='v'?t('merged'):'',f.br?f.br+' kbps':'',MB(f.size),f.hdr?'HDR':''].filter(Boolean).map(x=>`<i>${esc(x)}</i>`).join('')}</span></button>`;
  const sec=(h,l)=>l.length?`<h2>${h}</h2><div class="grid">${l.map(card).join('')}</div>`:'';
  put(`<div class="glass pv">${d.thumb?`<img src="${esc(d.thumb)}" alt="" referrerpolicy="no-referrer">`:''}<div><b>${esc(d.title)}</b><small>${esc(d.who)}${d.who&&d.dur?', ':''}${T(d.dur)}</small></div></div>`
    +sec(t('av'),av)+sec(t('vo'),v)+sec(t('ao'),a));
}

out.onclick=async ev=>{
  const b=ev.target.closest('.fmt');if(!b)return;
  const {f,k,e}=b.dataset,old=b.innerHTML;
  b.disabled=true;b.querySelector('b').textContent=t('prep');
  try{
    const r=await fetch(`/api/prepare?url=${encodeURIComponent(u.value.trim())}&f=${encodeURIComponent(f)}&k=${k}&e=${e}`),d=await r.json();
    if(!r.ok)throw Error(d.error);
    const l=document.createElement('a');l.href='/api/file/'+d.token;l.download=d.name;l.click();
    say(t('started')+MB(d.size));
  }catch(x){say(x.message?tr(x.message):t('failprep'))}
  b.innerHTML=old;b.disabled=false;
};

u.oninput=()=>{const b=$('#bd'),x=site(u.value.trim());if(x){b.textContent=x;b.classList.remove('hide')}else b.classList.add('hide')};
u.onpaste=()=>setTimeout(()=>{u.oninput();load()},60);
u.onkeydown=e=>e.key==='Enter'&&load();
$('#go').onclick=load;
$('#p').onclick=async()=>{try{u.value=await navigator.clipboard.readText();u.oninput();load()}catch{say(t('clip'))}};
theme(document.documentElement.dataset.theme);apply();requestAnimationFrame(()=>requestAnimationFrame(()=>document.documentElement.classList.add('ready')));
const q=new URLSearchParams(location.search),pre=q.get('url')||q.get('text');
if(pre){u.value=pre;u.oninput();load()}
</script>
</body>
</html>
