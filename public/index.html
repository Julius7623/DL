<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>GlassDL, unduh video dari link apa saja</title>
<style>
:root{--bg1:#e6eeff;--bg2:#f3e6ff;--t:#10131c;--t2:#566074;--g:rgba(255,255,255,.5);--gb:rgba(255,255,255,.75);--ac:#0a84ff;--sh:0 12px 40px rgba(30,40,90,.16)}
@media(prefers-color-scheme:dark){:root{--bg1:#0b1020;--bg2:#190f2d;--t:#f5f7ff;--t2:#9aa3b8;--g:rgba(255,255,255,.08);--gb:rgba(255,255,255,.2);--sh:0 12px 40px rgba(0,0,0,.5)}}
*{box-sizing:border-box;margin:0}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:var(--t);min-height:100vh;background:linear-gradient(160deg,var(--bg1),var(--bg2));padding:max(20px,env(safe-area-inset-top)) 16px max(40px,env(safe-area-inset-bottom));overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.55;z-index:-1;animation:fl 24s ease-in-out infinite alternate}
.b1{width:46vmax;height:46vmax;background:#0a84ff;top:-12vmax;left:-10vmax}
.b2{width:46vmax;height:46vmax;background:#bf5af2;bottom:-14vmax;right:-8vmax;animation-delay:-9s}
.b3{width:28vmax;height:28vmax;background:#30d158;top:42%;left:58%;opacity:.3;animation-delay:-15s}
@keyframes fl{to{transform:translate(8vmax,6vmax) scale(1.15)}}
main{max-width:780px;margin:0 auto}
h1{font-size:clamp(30px,7vw,46px);font-weight:700;letter-spacing:-.035em;text-align:center;margin:32px 0 8px}
.sub{text-align:center;color:var(--t2);margin-bottom:26px}
.glass{position:relative;background:var(--g);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);border:1px solid var(--gb);border-radius:28px;box-shadow:var(--sh),inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.12)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.26),transparent 40%)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass,.fmt{background:var(--bg1)}}
button{font:inherit;color:inherit;border:0;cursor:pointer;transition:transform .4s cubic-bezier(.34,1.56,.64,1),background .2s}
button:active{transform:scale(.96)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.bar{display:flex;align-items:center;gap:8px;padding:8px}
.bar input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:inherit;font:inherit;padding:14px 14px}
.pill{font-size:13px;font-weight:600;padding:5px 11px;border-radius:99px;background:rgba(10,132,255,.16);color:var(--ac);white-space:nowrap}
.pill:empty{display:none}
.btn{background:var(--ac);color:#fff;border-radius:20px;height:48px;padding:0 20px;font-weight:600}
.ghost{background:var(--g);border:1px solid var(--gb);border-radius:20px;height:48px;padding:0 16px}
.pv{display:flex;gap:14px;padding:14px;margin-top:16px;align-items:center}
.pv img{width:136px;aspect-ratio:16/9;object-fit:cover;border-radius:16px;background:var(--g)}
.pv b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pv small{color:var(--t2)}
h2{font-size:15px;font-weight:600;color:var(--t2);margin:24px 6px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
.fmt{text-align:left;padding:14px 16px;border-radius:22px;background:var(--g);border:1px solid var(--gb);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
.fmt:hover{transform:translateY(-2px) scale(1.015)}
.fmt b{display:block;font-size:18px;letter-spacing:-.01em}
.tag{display:block;font-size:12px;font-weight:700;color:var(--ac);margin-bottom:3px}
.m{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.m i{font-style:normal;font-size:12px;padding:3px 9px;border-radius:99px;background:rgba(127,127,127,.17);color:var(--t2)}
.fmt:disabled{opacity:.6;pointer-events:none}
.sk{height:110px;margin-top:16px;animation:pl 1.3s ease-in-out infinite}
@keyframes pl{50%{opacity:.5}}
.empty{text-align:center;color:var(--t2);padding:30px 10px}
.foot{text-align:center;color:var(--t2);font-size:13px;margin-top:34px}
#t{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;pointer-events:none;padding:12px 20px;border-radius:99px;transition:.45s cubic-bezier(.34,1.56,.64,1);max-width:90vw;text-align:center}
#t.on{transform:translate(-50%,0);opacity:1}
@media(max-width:520px){.pv{flex-direction:column;align-items:stretch}.pv img{width:100%}.bar .ghost{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i>
<main>
  <h1>Unduh video dari link apa saja</h1>
  <p class="sub">YouTube, Instagram, TikTok, Facebook, X, dan ribuan situs lain. Tanpa iklan, tanpa akun.</p>
  <div class="glass bar">
    <input id="u" type="url" inputmode="url" placeholder="Tempel link video di sini" aria-label="Link video" autocomplete="off">
    <span class="pill" id="bd"></span>
    <button class="ghost" id="p" aria-label="Tempel dari clipboard">Tempel</button>
    <button class="btn" id="go">Cari</button>
  </div>
  <div id="out"><p class="empty">Tempel link, lalu pilih format yang kamu mau.</p></div>
  <p class="foot">Gunakan untuk konten milik sendiri, berlisensi, atau pemakaian pribadi. Link dan file tidak disimpan.</p>
</main>
<div class="glass" id="t" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s),u=$('#u'),out=$('#out'),tt=$('#t');
const sites={youtu:'YouTube',instagram:'Instagram',facebook:'Facebook','fb.':'Facebook',tiktok:'TikTok','x.com':'X',twitter:'X',reddit:'Reddit',vimeo:'Vimeo',twitch:'Twitch'};
const site=s=>(Object.entries(sites).find(([k])=>s.includes(k))||[])[1]||(s.startsWith('http')?'Link':'');
const MB=n=>!n?'ukuran belum diketahui':'sekitar '+(n>=1e9?(n/1e9).toFixed(2)+' GB':Math.max(1,Math.round(n/1e6))+' MB');
const T=s=>s?[Math.floor(s/3600),Math.floor(s/60)%60,Math.floor(s%60)].filter((x,i)=>i||x).map((x,i)=>i?String(x).padStart(2,'0'):x).join(':'):'';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const say=(m,ms=3800)=>{tt.textContent=m;tt.classList.add('on');clearTimeout(say.t);say.t=setTimeout(()=>tt.classList.remove('on'),ms)};

async function load(){
  const url=u.value.trim();
  if(!/^https?:\/\//i.test(url)) return say('Masukkan link yang diawali http atau https');
  out.innerHTML='<div class="glass sk"></div>';
  try{
    const r=await fetch('/api/info?url='+encodeURIComponent(url)),d=await r.json();
    if(!r.ok) throw Error(d.error);
    show(d);
  }catch(e){out.innerHTML='<p class="empty">'+esc(e.message||'Gagal memuat video')+'. Periksa link atau coba lagi.</p>'}
}

function show(d){
  const by=k=>d.formats.filter(f=>f.k===k),key=f=>f.h*1e4+f.br,desc=(x,y)=>key(y)-key(x);
  const av=by('av').sort(desc),v=by('v').sort(desc),a=by('a').sort((x,y)=>y.br-x.br);
  const vid=[...av,...v].sort(desc);
  const best=vid[0],compat=vid.find(f=>f.vc==='H.264'&&f.ext==='mp4'),small=av.filter(f=>f.size).sort((x,y)=>x.size-y.size)[0];
  const tag=f=>f===best?'Terbaik':f===compat?'Paling kompatibel':f===small?'Paling kecil':'';
  const card=f=>`<button class="fmt" data-f="${esc(f.id)}" data-k="${f.k}" data-e="${f.ext}">${tag(f)?`<span class="tag">${tag(f)}</span>`:''}<b>${f.h?f.h+'p'+(f.fps>30?f.fps:'')+' '+f.ext.toUpperCase():f.ext.toUpperCase()+' audio'}</b><span class="m">${[f.vc,f.ac,f.k==='v'?'digabung audio':'',f.br?f.br+' kbps':'',MB(f.size),f.hdr?'HDR':''].filter(Boolean).map(x=>`<i>${esc(x)}</i>`).join('')}</span></button>`;
  const sec=(t,l)=>l.length?`<h2>${t}</h2><div class="grid">${l.map(card).join('')}</div>`:'';
  out.innerHTML=`<div class="glass pv">${d.thumb?`<img src="${esc(d.thumb)}" alt="" referrerpolicy="no-referrer">`:''}<div><b>${esc(d.title)}</b><small>${esc(d.who)}${d.who&&d.dur?', ':''}${T(d.dur)}</small></div></div>`
    +sec('Video dengan suara',av)+sec('Video saja (suara terbaik ditambahkan otomatis)',v)+sec('Audio saja',a);
}

out.onclick=async ev=>{
  const b=ev.target.closest('.fmt'); if(!b) return;
  const {f,k,e}=b.dataset,old=b.innerHTML;
  b.disabled=true; b.querySelector('b').textContent='Menyiapkan file...';
  try{
    const r=await fetch(`/api/prepare?url=${encodeURIComponent(u.value.trim())}&f=${encodeURIComponent(f)}&k=${k}&e=${e}`),d=await r.json();
    if(!r.ok) throw Error(d.error);
    const l=document.createElement('a'); l.href='/api/file/'+d.token; l.download=d.name; l.click();
    say('Unduhan dimulai, '+MB(d.size));
  }catch(x){say(x.message||'Gagal menyiapkan file')}
  b.innerHTML=old; b.disabled=false;
};

u.oninput=()=>$('#bd').textContent=site(u.value.trim());
u.onpaste=()=>setTimeout(()=>{u.oninput();load()},60);
u.onkeydown=e=>e.key==='Enter'&&load();
$('#go').onclick=load;
$('#p').onclick=async()=>{try{u.value=await navigator.clipboard.readText();u.oninput();load()}catch{say('Izinkan akses clipboard, atau tempel manual')}};
const q=new URLSearchParams(location.search),pre=q.get('url')||q.get('text');
if(pre){u.value=pre;u.oninput();load()}
</script>
</body>
</html>
